# v1 默认参数 + 用户指定初始资金 50w
initial_capital: 100000.0

# 数据
data_source: "qmt"       # "qmt" (默认, qmt300下的.DAT) 或 "data_a" (300data/data_a下的CSV)
data_root: "../qmt300"
results_dir: "results"

# 时间段（必须 CLI 或此处提供）
start_date: null
end_date: null

# 费率（v1 默认）
commission_rate: 0.0001
commission_min: 5.0
stamp_rate: 0.001
transfer_rate: 0.00001
slippage_rate: 0.0005

# 策略参数（v1 默认）
max_positions: 5
rebalance_interval: 10
warmup_days: 120
